# Multimodal RAG – one-command stack:  cp .env.example .env && docker compose up --build
# Optional local LLM:                  docker compose --profile ollama up --build

name: multimodal-rag

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      # Bake the same dense model the app uses (read from .env) into the image.
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  image: multimodal-rag-backend:latest
  env_file:
    - .env
  environment:
    # Container-network overrides (win over the values in .env)
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    DATA_DIR: /data
    # Override with DOCKER_OLLAMA_BASE_URL=http://host.docker.internal:11434 to use a host Ollama
    OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://ollama:11434}
  volumes:
    - data:/data
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships without curl/wget: use bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\r\n\r\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    # Reuse the image built by `api` (building the same tag twice in parallel races).
    build: !reset null
    pull_policy: never
    # --concurrency=1: each prefork child loads its own FastEmbed models (dense +
    # BM25, ~600 MB) and PyMuPDF buffers; two children OOM a memory-constrained
    # (~8 GB) Docker VM next to Ollama. Scale out with `--scale worker=N` instead.
    # Task time limits / broker visibility timeout come from INGESTION_*_TIME_LIMIT_SECONDS.
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - worker
      - -Q
      - ingestion
      - --concurrency=1
      - --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.infrastructure.queue.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: multimodal-rag-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.1   # recent enough for the gemma3 manifest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: pulls the chat model into the shared volume (no-op if already present).
  ollama-pull:
    image: ollama/ollama:0.35.1
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_CHAT_MODEL:-gemma3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    # GPU (NVIDIA) – uncomment if available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  data:
  qdrant_data:
  redis_data:
  ollama_data:
